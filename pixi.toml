[workspace]
authors = ["rymskip <17lochinskij@protonmail.com>"]
channels = ["conda-forge", "https://prefix.dev/rymskip/theedstow"]
name = "evenframe"
platforms = ["osx-64", "linux-64"]
version = "0.1.0"

[tasks]
verify = "cargo run -p tooling -- verify"
verify-fast = "cargo run -p tooling -- verify --fail-fast"
test = "cargo run -p tooling -- test"
test-snapshot = "cargo run -p tooling -- test --snapshot"
test-e2e = "cargo run -p tooling -- test --e2e"
test-generated = "cargo run -p tooling -- generated"
test-derive = "cargo run -p tooling -- test --derive"
snapshot-accept = "cargo run -p tooling -- snapshot accept"
snapshot-review = "cargo run -p tooling -- snapshot review"
snapshot-update = "cargo run -p tooling -- snapshot update"
# Takes the level: `pixi run bump patch` (or minor, major).
bump = "cargo run -p tooling -- bump"
# Takes the output directory: `pixi run bench-fixture <dir> [--modules N --types N]`.
bench-fixture = "cargo run -p tooling -- bench-fixture"

[dependencies]
# Rust toolchain manager, shipping the cargo, rustc and other proxies. The
# active rust version, components, and targets are pinned in
# rust-toolchain.toml at the repo root; rustup auto-installs that toolchain on
# first cargo invocation. RUSTUP_HOME is shared with the global rustup install
# via [activation.env] below.
# NOTE: the e2e tests need a running SurrealDB, but surreal is intentionally
# NOT a pixi dependency here (no public conda package); it's expected from a
# global install.
rustup = { version = "*", channel = "https://prefix.dev/rymskip/theedstow" }
cargo-insta = ">=1.49.0,<2"
libprotobuf = ">=7.36.2,<8"
flatbuffers = ">=25.12.19,<26"
deno = ">=2.9.5,<2.10"
hyperfine = ">=1.20.0,<2"

[activation.env]
RUSTUP_HOME = "$HOME/.pixi/envs/rustup/.rustup"

# mold linker, Linux only. `.cargo/config.toml` sets `-fuse-ld=mold` for the
# linux target; this puts `mold` on the env PATH so cargo finds it. macOS uses
# Apple's ld-prime and doesn't need it.
[target.linux-64.dependencies]
mold = ">=2.40"
