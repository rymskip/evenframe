[workspace]
members = ["evenframe_core", "evenframe", "evenframe_derive", "evenframe_plugin", "tests_macros", "tooling"]
resolver = "2"

[workspace.dependencies]
try_from_expr = "0.1.1"
evenframe_core = { path = "evenframe_core" }
serde_json = "1.0.151"
regex = "1.13.1"
syn = { version = "3.0.5", features = ["full"] }
tracing = "0.1.44"
convert_case = "0.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.6"
insta = "1.48"
url = "2.5"
uuid = { version = "1.26", features = ["v4", "serde"] }

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3
