[workspace]
members = [
    "evenframe_core",
    "evenframe",
    "evenframe_derive",
    "evenframe_plugin",
    "tooling",
    "tooling/derive_check",
    "tooling/tests_macros",
]
resolver = "3"

[workspace.dependencies]
try_from_expr = "0.2.0"
evenframe_core = { path = "evenframe_core" }
serde_json = "1.0.151"
regex = "1.13.1"
syn = { version = "3.0.6", features = ["full"] }
tracing = "0.1.44"
convert_case = "0.12.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.6"
insta = "1.49"
url = "2.5"
uuid = { version = "1.27", features = ["v4", "serde"] }

[workspace.lints.clippy]
wildcard_imports = "deny"
enum_glob_use = "deny"

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3
