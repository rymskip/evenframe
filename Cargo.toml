[workspace]
members = [
    "evenframe_core",
    "evenframe",
    "evenframe_derive",
    "evenframe_plugin",
    "tooling",
    "tooling/derive_check",
    "tooling/tests_macros",
]
resolver = "3"

[workspace.dependencies]
try_from_expr = "0.2.0"
serde_json = "1.0.154"
regex = "1.13.2"
syn = { version = "3.0.10", features = ["full"] }
tracing = "0.1.44"
convert_case = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.2.2"
insta = "1.49"
url = "2.5"
uuid = { version = "1.29", features = ["v4", "serde"] }

[workspace.lints.clippy]
wildcard_imports = "deny"
enum_glob_use = "deny"

