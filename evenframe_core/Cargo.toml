[package]
name = "evenframe_core"
version = "0.6.0"
edition = "2024"
authors = ["Jakob Lochinski"]
license = "MIT"
description = "Core functionality for Evenframe - TypeScript type generation and database schema synchronization"
repository = "https://github.com/rymskip/evenframe"
documentation = "https://docs.rs/evenframe_core"
readme = "../README.md"
keywords = ["typescript", "codegen", "surrealdb", "schema", "types"]
categories = ["development-tools", "database"]

[features]
# By default, no optional features are enabled. This compiles only the minimal
# core needed for derive macros: types, config, validators, wrappers, and the
# schemasync data types (DefineConfig, EdgeConfig, etc.). This is the fastest
# possible compile and is what evenframe_derive depends on.
default = []

# Enables file-based debug logging via the `evenframe_log!` macro.
# Writes .log and .surql files to $ABSOLUTE_PATH_TO_EVENFRAME/evenframe/logs/
# (the system temp directory when the variable is unset).
# Not intended for production use.
dev-mode = []

# ---------------------------------------------------------------------------
# Type synchronization (TypeScript / schema generation)
# ---------------------------------------------------------------------------

# Enables the typesync generators: ArkType and Effect-TS, file grouping,
# import resolution and doc comments. The typesync config types are always
# compiled (EvenframeConfig uses them); the generators need this feature.
typesync = ["dep:rayon"]

# Enables Protocol Buffers (.proto) schema generation from Rust types.
# Implies: typesync
protobuf = ["typesync"]

# Enables FlatBuffers (.fbs) schema generation from Rust types.
# Implies: typesync
flatbuffers = ["typesync"]

# Enables Macroforge TypeScript interface generation with JSDoc annotations.
# Implies: typesync
macroforge = ["typesync"]

# Enables all typesync generators: ArkType, Effect-TS, Protocol Buffers,
# FlatBuffers, and Macroforge.
typesync-all = ["typesync", "protobuf", "flatbuffers", "macroforge"]

# ---------------------------------------------------------------------------
# Schema synchronization (database operations)
# ---------------------------------------------------------------------------

# Enables the schemasync engine for comparing and synchronizing Rust struct
# definitions against a live SurrealDB database: schema comparison, DEFINE
# statement generation and the database execution pipeline. No mock data.
# Implies: surrealdb
schemasync = ["surrealdb", "tempfile", "dep:futures", "dep:rand", "dep:tokio"]

# The mock data engine: generates and writes mock records during schemasync,
# with the full IANA timezone database. Without it, any request for mock
# data is an error.
# Implies: schemasync
mockmake = ["schemasync", "dep:chrono-tz"]

# WASM plugins: typesync output-rule and synthetic-item plugins, and, with
# mockmake, mock-data plugins. Pulls in the wasmtime runtime.
wasm-plugins = ["dep:wasmtime"]

# ---------------------------------------------------------------------------
# Database providers
# ---------------------------------------------------------------------------

# Enables SurrealDB as a database backend. Pulls in the full surrealdb client
# with in-memory (kv-mem) and HTTP protocol support. This is the heaviest
# single dependency in the tree (~200+ transitive crates).
surrealdb = ["dep:surrealdb"]

# ---------------------------------------------------------------------------
# Convenience bundles
# ---------------------------------------------------------------------------

# Workspace scanning, the scan and expansion caches, the process lock and
# `tooling::generate()` for build scripts. evenframe_derive builds without it.
# Implies: typesync
tooling = ["typesync", "dep:ignore", "dep:blake3"]

# Enables every feature: all generators, schemasync with mock data, WASM
# plugins and tooling. Use this for CI or when you need everything.
full = ["mockmake", "typesync-all", "wasm-plugins", "tooling"]

# The feature set used by the evenframe CLI binary. Enables full schemasync
# with mock data, all type generators, tooling, and SurrealDB.
cli = ["mockmake", "typesync-all", "wasm-plugins", "tooling", "dep:clap"]

[dependencies]
# workspace dependencies
serde_json = { workspace = true }
regex = { workspace = true }
try_from_expr = { workspace = true }
syn = { workspace = true }
tracing = { workspace = true }
convert_case = { workspace = true }
tokio = { workspace = true, optional = true }
toml = { workspace = true }
url = { workspace = true }

# Database providers (optional based on features)
surrealdb = { version = "3.2.4", features = ["kv-mem", "protocol-http"], optional = true }
tempfile = { version = "3.27", optional = true }
# Lets the CLI use core enums as argument values.
clap = { version = "4.6", features = ["derive"], optional = true }

# Always compiled (core)
dotenvy = "0.15.7"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
chrono = "0.4.45"
derive_more = { version = "2.1.1", features = ["from"] }
petgraph = "0.8.3"
serde-value = "0.7.0"
thiserror = "2.0.20"
ordered-float = { version = "5.5.0", features = ["serde"] }
linkme = "0.3.37"
# ArkType string keyword checks shared by derive, mockmake and typesync
unicode-normalization = "0.1.25"
fancy-regex = "0.19.2"

# Always compiled (used in type definitions throughout)
bon = "3.10.1"
uuid = { version = "1.26", features = ["v4", "serde"] }
strum = { version = "0.28.0", features = ["derive"] }

# Optional: the schemasync engine
futures = { version = "0.3.34", optional = true }
rand = { version = "0.10.2", optional = true }

# Optional: mockmake runtime dependencies
chrono-tz = { version = "0.10.4", optional = true }

# Optional: the typesync generators and tooling
rayon = { version = "1.12", optional = true }
ignore = { version = "0.4.33", optional = true }
blake3 = { version = "1.8", optional = true }

# Optional: WASM plugin runtime
wasmtime = { version = "48", optional = true }

[dev-dependencies]
proptest = "1.11"
mockall = "0.15"
temp-env = "0.3"
tempfile = "3.27"
pretty_assertions = "1.4"
insta = { workspace = true }
serde_json = { workspace = true }
tests_macros = { path = "../tests_macros" }

[lints]
workspace = true
