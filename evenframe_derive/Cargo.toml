[package]
name = "evenframe_derive"
version = "0.6.0"
edition = "2024"
authors = ["Jakob Lochinski"]
license = "MIT"
description = "Derive macros for Evenframe - automatic database schema and CRUD generation"
repository = "https://github.com/rymskip/evenframe"
documentation = "https://docs.rs/evenframe_derive"
readme = "../README.md"
keywords = ["macro", "derive", "surrealdb", "codegen", "database"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]

# workspace dependencies
convert_case = { workspace = true }
evenframe_core = { version = "0.6.0", path = "../evenframe_core", default-features = false }

proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.5", features = ["full"] }


[dev-dependencies]
trybuild = "1.0"
proptest = "1.11"
pretty_assertions = "1.4"
evenframe = { path = "../evenframe", default-features = false }
linkme = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
chrono = { version = "0.4.45", features = ["serde"] }

[features]
default = []

[lints]
workspace = true
