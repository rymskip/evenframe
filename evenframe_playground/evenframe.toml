[general]
apply_aliases = []

[schemasync]
should_generate_mocks = true

[schemasync.database]
provider = "surrealdb"
url = "${SURREALDB_URL}"
namespace = "${SURREALDB_NS}"
database = "${SURREALDB_DB}"
timeout = 60
# DEFINE ANALYZER statements (a .surql file or a directory of them), applied
# before tables so FULLTEXT indexes can reference them. They are re-applied on
# every sync, so use `DEFINE ANALYZER OVERWRITE`. Analyzers that disappear from
# these files are removed from the database.
analyzers = { path = "surql/analyzers.surql" }

[[schemasync.database.accesses]]
name = "user"
access_type = "Record"
table_name = "user"

[schemasync.mock_gen_config]
default_record_count = 100
default_preservation_mode = "Smart"
default_batch_size = 100
full_refresh_mode = false
coordination_groups = []
# Emit embedded-JavaScript ASSERTs for field validators that have no native
# SurrealQL equivalent (credit-card/Luhn, JSON, Unicode normalization,
# finiteness, capitalization). These require the SurrealDB server to run with
# --allow-scripting. Set to false to skip them — every native assertion still
# applies — so the generated schema stays applicable on servers without
# scripting. Default: true.
scripting_asserts = true

[schemasync.performance]
embedded_db_memory_limit = "1GB"
cache_duration_seconds = 300
use_progressive_loading = true

[typesync]
should_generate_arktype_types = true
should_generate_effect_types = true
should_generate_macroforge_types = false
should_generate_flatbuffers_types = true
flatbuffers_namespace = "evenframe.playground"
should_generate_protobuf_types = true
protobuf_package = "evenframe.playground"
protobuf_import_validate = true
should_generate_surrealdb_schemas = true
output_path = "./src/bindings/"
