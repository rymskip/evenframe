[package]
name = "evenframe"
version = "0.6.0"
edition = "2024"
authors = ["Jakob Lochinski"]
license = "MIT"
description = "A unified framework for TypeScript type generation and database schema synchronization"
repository = "https://github.com/rymskip/evenframe"
documentation = "https://docs.rs/evenframe"
homepage = "https://github.com/rymskip/evenframe"
readme = "../README.md"
keywords = ["typescript", "codegen", "surrealdb", "schema", "types"]
categories = ["development-tools", "database"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "evenframe"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[features]
# Default includes the CLI feature set, which the evenframe binary needs.
# Library consumers use `default-features = false` and pick only what they
# need; nothing below is enabled unless a feature asks for it.
default = ["cli"]

# Enables file-based debug logging via the `evenframe_log!` macro.
# Writes .log/.surql files to $ABSOLUTE_PATH_TO_EVENFRAME/evenframe/logs/
# (the system temp directory when the variable is unset).
# Not intended for production use.
dev-mode = ["evenframe_core/dev-mode"]

# The CLI feature set: schemasync with mock data, all generators and WASM
# plugins. This is what the evenframe binary requires. See evenframe_core for
# the full feature breakdown.
cli = [
  "evenframe_core/cli",
  "schemasync",
  "surrealdb",
  "typesync-all",
  "dep:clap",
  "dep:serde",
  "dep:serde_json",
  "dep:tokio",
  "dep:toml",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:walkdir",
  "dep:yaml_serde",
]

# --- Type synchronization (forwarded to evenframe_core) ---

# Core typesync generators (ArkType, Effect-TS).
typesync = ["evenframe_core/typesync"]
# All typesync generators including Protocol Buffers, FlatBuffers, and Macroforge.
typesync-all = ["evenframe_core/typesync-all"]
# Protocol Buffers (.proto) generation. Implies: typesync.
protobuf = ["evenframe_core/protobuf"]
# FlatBuffers (.fbs) generation. Implies: typesync.
flatbuffers = ["evenframe_core/flatbuffers"]
# Macroforge TypeScript interface generation. Implies: typesync.
macroforge = ["evenframe_core/macroforge"]

# --- Schema synchronization (forwarded to evenframe_core) ---

# Schema comparison and synchronization engine. Implies: surrealdb.
schemasync = ["evenframe_core/schemasync"]
# The mock data engine. Implies: schemasync.
mockmake = ["evenframe_core/mockmake"]
# WASM plugins for typesync and, with mockmake, mock data.
wasm-plugins = ["evenframe_core/wasm-plugins"]

# --- Database providers (forwarded to evenframe_core) ---

# SurrealDB client (kv-mem + HTTP protocol). Heaviest single dependency.
surrealdb = ["evenframe_core/surrealdb"]

# --- Convenience ---

# Everything: all generators, schemasync with mock data, and WASM plugins.
full = ["evenframe_core/full"]

[dependencies]

# workspace dependencies
evenframe_core = { version = "0.6.0", path = "../evenframe_core", default-features = false }
convert_case = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
evenframe_derive = { version = "0.6.0", path = "../evenframe_derive" }
linkme = "0.3.37"

# The evenframe binary (the `cli` feature)
clap = { version = "4.6", features = ["derive", "env"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
walkdir = { version = "2.5.0", optional = true }
yaml_serde = { version = "0.10.7", optional = true }

[dev-dependencies]
insta = { workspace = true, features = ["filters"] }
tempfile = "3.27"
mockall = "0.15"
proptest = "1.11"
pretty_assertions = "1.4"
