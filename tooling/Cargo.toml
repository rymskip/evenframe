[package]
name = "tooling"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
# Line numbers for the glob-import check's findings.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { workspace = true, features = ["visit"] }
semver = "1.0.28"
toml_edit = "0.25.15"
# The progress of each verify run, kept in `.verify/`.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
chrono = "0.4.45"

[lints]
workspace = true
