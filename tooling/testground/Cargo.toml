[package]
name = "testground"
version = "0.1.4"
edition = "2024"
authors = ["Jakob Lochinski"]
description = "A test application exercising Evenframe through Axum"

# Empty workspace to exclude from parent workspace
[workspace]

[lints.clippy]
wildcard_imports = "deny"
enum_glob_use = "deny"

[features]
default = []
wasm-plugins = ["evenframe_core/wasm-plugins"]

[dependencies]
# Evenframe dependencies
evenframe = { path = "../../evenframe", features = ["metadata", "schemasync"] }
evenframe_derive = { path = "../../evenframe_derive" }
evenframe_core = { path = "../../evenframe_core" }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The SDK's record id, which record links hold
surrealdb-types = "3.3.0"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
protox = "0.9"
surrealdb = { version = "3.3.0", features = ["kv-mem", "protocol-http"] }
